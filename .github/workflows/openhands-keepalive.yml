name: openhands-keepalive

# Pitää OpenHands-agentit käynnissä: täsmälleen yksi kanoninen conversation per
# repositorio. Kanoninen on uusin conversation, jolla on vielä sandbox. Vasta kun
# kaikki sandboxit ovat MISSING, käytetään vanhempaa conversationia tai luodaan uusi.
#
# Loop-moodissa ei ole lopetustokenia: agentti ei voi pysäyttää looppia. Kun työt
# loppuvat, se tutkii itse tärkeäksi kokemansa aiheen ja avaa tuloksista PR:n, jota
# se ei mergaa vaan jättää ihmisen arvioitavaksi.
#
# Ajastus: GitHubin oma schedule on epäluotettava, joten suurin osa ajoista tulee
# ulkoisesta dispatchistä (cron-job.org). keepalive-deadman.yml hälyttää, jos ajoja
# ei tule lainkaan.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   OPENHANDS_API_KEY            required
#   OPENHANDS_CONVERSATION_IDS   seed IDs / bootstrap scope
#   OPENHANDS_SKIP_IDS           optional
#   OPENHANDS_SKIP_REPOSITORIES  optional comma-separated owner/repo denylist
#   OPENHANDS_NUDGE              optional override text
#
# External cron example (workflow_dispatch):
#   POST /repos/<owner>/automation/actions/workflows/openhands-keepalive.yml/dispatches
#   {"ref":"main","inputs":{"dry-run":"false","discover":"true"}}
#
# HUOM: repositorio on julkinen, joten Actions-logit ja step summaryt ovat julkisia.
# Skripti peittää repositorioiden nimet, conversation-titlet ja täydet UUID:t
# oletuksena; OPENHANDS_VERBOSE=1 on tarkoitettu vain paikalliseen ajoon.

on:
  # PR- ja push-ajot vain validoivat koodin (testit). Ne eivät koske oikeisiin
  # conversationeihin, joten yksikään PR ei voi tönäistä tuotannon agentteja.
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Test without sending nudges"
        required: false
        default: false
        type: boolean
      discover:
        description: "Discover conversations and enforce one newest canonical conversation per repository"
        required: false
        default: true
        type: boolean

run-name: "OpenHands keepalive (dry-run=${{ inputs.dry-run || false }}, discover=${{ inputs.discover || false }})"

permissions:
  contents: read

jobs:
  # Validoi koodi kaikilla triggereillä (myös PR:issä). Ei salaisuuksia, ei
  # verkkoliikennettä. Tämä on ainoa paikka, jossa testit ajetaan.
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate keepalive script
        run: python3 -m py_compile scripts/openhands-keepalive.py
      - name: Install test dependency
        shell: bash
        run: |
          python3 -c "import requests" 2>/dev/null || pip install --quiet requests
      - name: Run keepalive tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'

  keepalive:
    # Vain ajastettu tai käsin käynnistetty ajo saa tönäistä oikeita
    # conversationeita. PR- ja push-ajot eivät koske niihin.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Päällekkäiset ajot jonottavat peräkkäin, eivät koskaan rinnakkain.
    # Concurrency on tässä jobissa (ei koko workflow'ssa), jotta PR-ajot eivät
    # jonota oikeita keepalive-ajoja.
    concurrency:
      group: openhands-keepalive
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Run keepalive check (once)
        shell: bash
        env:
          OPENHANDS_API_KEY: ${{ secrets.OPENHANDS_API_KEY }}
          OPENHANDS_CONVERSATION_IDS: ${{ secrets.OPENHANDS_CONVERSATION_IDS }}
          OPENHANDS_SKIP_IDS: ${{ secrets.OPENHANDS_SKIP_IDS }}
          OPENHANDS_SKIP_REPOSITORIES: ${{ secrets.OPENHANDS_SKIP_REPOSITORIES }}
          OPENHANDS_NUDGE: ${{ secrets.OPENHANDS_NUDGE }}
          OPENHANDS_NUDGE_MODE: "loop"
          OPENHANDS_IDLE_TIMEOUT: "900"
          OPENHANDS_RESUME_COOLDOWN: "900"
          # Nudgea ei lähetetä samalle conversationille tätä tiheämmin. Tämä
          # estää sen, että jumissa oleva conversation saisi nuden joka ajolla.
          OPENHANDS_MIN_NUDGE_INTERVAL: "1800"
          # Neljän vastaamattoman nuden jälkeen conversation todetaan jumiin
          # jääneeksi ja se korvataan.
          OPENHANDS_MAX_STALLED_NUDGES: "4"
          # Aikabudjetti: yhteenveto ehtii syntyä ennen jobin timeoutia.
          OPENHANDS_RUN_BUDGET_SECONDS: "420"
          # Aseta "true", jos haluat että ajo epäonnistuu kun jokin conversation
          # tarvitsee ihmisen (waiting_for_confirmation).
          OPENHANDS_FAIL_ON_ATTENTION: "false"
          # A green run means every repository ended in a healthy or recovered state.
          OPENHANDS_FAIL_ON_RISK: "true"
          # Defence in depth: verbose output is disabled in public Actions logs.
          OPENHANDS_VERBOSE: "false"
          # Pidä conversation-otsikot muodossa "repo: ..." (ilman omistajaa),
          # jotta UI:sta näkee yhdellä silmäyksellä mikä repo on työstössä.
          OPENHANDS_TITLE_SYNC: "true"
          # Resume on asynkroninen: odota enintään 90 s (5 s välein), että sandbox
          # ehtii RUNNING-tilaan ennen kuin conversationia käytetään uudelleen.
          OPENHANDS_RESUME_WAIT_SECONDS: "90"
          OPENHANDS_RESUME_POLL_INTERVAL: "5"
          OPENHANDS_DRY_RUN: ${{ inputs.dry-run || false }}
          # schedule -> always discover; workflow_dispatch respects the discover input
          OPENHANDS_AUTO_DISCOVER: ${{ github.event_name == 'schedule' || inputs.discover }}
        run: |
          python3 scripts/openhands-keepalive.py --once
